<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PC Tips by Ez_peter - RAMMap Memory Optimization</title>
  <style>
    :root {
      --bg: #f8f4ee;
      --text: #0d0d0d;
      --accent: #1a6cf0;
      --grey-light: #f0ede6;
      --grey-mid: #6b7280;
      --grey-border: #d1d5db;
      --red: #e53935;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* TOP BAR & PROGRESS */
    #topArea {
      position: absolute;
      top: 60px;
      left: 60px;
      width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }
    #progressBar {
      width: 100%;
      height: 8px;
      display: flex;
      gap: 3px;
      margin-bottom: 24px;
    }
    .prog-seg {
      flex: 1;
      height: 100%;
      background: rgba(13, 13, 13, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
    }
    #pillTag {
      background: #0d0d0d;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 6px 20px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    #stepLabel {
      color: var(--accent);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
      height: 32px;
    }
    #sceneTitle {
      font-size: 52px;
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 8px;
      height: 64px;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    #breadcrumb {
      font-size: 26px;
      font-weight: 600;
      color: var(--grey-mid);
      text-align: center;
      height: 34px;
    }

    /* LAPTOP FRAME */
    #laptopContainer {
      position: absolute;
      top: 300px;
      left: 60px;
      width: 960px;
      height: 590px;
      z-index: 10;
    }
    #laptopScreenBezel {
      width: 960px;
      height: 550px;
      background: #18191c;
      border-radius: 20px 20px 4px 4px;
      padding: 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.22);
      position: relative;
    }
    #laptopWebcam {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #2d3035;
      border-radius: 50%;
    }
    #screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    #laptopBase {
      width: 1040px;
      height: 24px;
      background: linear-gradient(to bottom, #d6d9de 0%, #b4b8bf 60%, #9ca0a8 100%);
      border-radius: 4px 4px 28px 28px;
      margin-left: -40px;
      margin-top: 2px;
      position: relative;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
    }
    #laptopNotch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 8px;
      background: #8b8e96;
      border-radius: 0 0 10px 10px;
    }

    /* WINDOWS 11 DESKTOP / TASKBAR */
    .win-desktop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 120%, #dbeafe 0%, #eff6ff 45%, #f8fafc 100%);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .win-taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 50;
    }
    .taskbar-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tb-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .tb-win-logo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 20px;
      height: 20px;
    }
    .tb-win-logo div {
      background: #0078d4;
      border-radius: 1px;
    }
    .tb-search {
      height: 30px;
      width: 140px;
      background: #f1f3f9;
      border-radius: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      font-size: 13px;
      color: #64748b;
    }
    .tb-clock {
      position: absolute;
      right: 14px;
      font-size: 13px;
      color: #334155;
      font-weight: 500;
      text-align: right;
      line-height: 1.1;
    }

    /* REUSABLE WINDOW CONTAINER */
    .win-window {
      position: absolute;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .win-titlebar {
      height: 38px;
      background: #f8f9fa;
      border-bottom: 1px solid #edebe9;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #323130;
      user-select: none;
    }
    .win-controls {
      margin-left: auto;
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #605e5c;
    }

    /* CURSOR & CLICK RIPPLE */
    .win-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
    }
    .click-ripple {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: ripple 0.4s ease-out forwards;
      pointer-events: none;
      z-index: 99;
    }

    /* CAPTIONS */
    #captions {
      position: absolute;
      top: 925px;
      left: 40px;
      width: 1000px;
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 18px;
      text-align: center;
      z-index: 30;
    }
    .caption-word {
      font-size: 64px;
      font-weight: 900;
      color: #0d0d0d;
      letter-spacing: -1px;
      line-height: 1.1;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
      transition: transform 0.08s ease;
    }
    .caption-word.word-active {
      background: #1a6cf0;
      color: #ffffff !important;
      text-shadow: 0 2px 10px rgba(26, 108, 240, 0.4) !important;
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(26, 108, 240, 0.35);
    }

    /* CHARACTERS */
    .char-layer {
      position: absolute;
      bottom: -150px;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 15;
      will-change: transform;
    }
    #peterImg {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 1920px;
      object-fit: contain;
      transform: translateX(-1200px);
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.45)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
      image-rendering: -webkit-optimize-contrast;
      transform-origin: bottom center;
    }
    #stewieImg {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 1920px;
      object-fit: contain;
      transform: translateX(1200px);
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.45)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
      image-rendering: -webkit-optimize-contrast;
      transform-origin: bottom center;
    }

    /* RAMMap Desktop Window Styles */
    .rammap-app {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .rm-menubar {
      height: 30px;
      background: #f3f3f3;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 18px;
      font-size: 13px;
      color: #333;
      position: relative;
    }
    .rm-menu-item {
      padding: 3px 8px;
      border-radius: 4px;
      cursor: default;
    }
    .rm-menu-item.active {
      background: #1a6cf0;
      color: #ffffff;
      font-weight: 700;
    }
    .rm-dropdown {
      position: absolute;
      top: 28px;
      left: 45px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      width: 250px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      padding: 4px 0;
    }
    .rm-drop-item {
      padding: 7px 14px;
      font-size: 13px;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rm-drop-item.highlight {
      background: #e0edfe;
      color: #1a6cf0;
      font-weight: 700;
      border-left: 3px solid #1a6cf0;
    }
    .rm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .rm-table th {
      background: #f8fafc;
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      color: #64748b;
      font-weight: 600;
    }
    .rm-table td {
      padding: 5px 10px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }
  </style>
</head>

          peterX = -1200 * (1 - inFrac);
        } else if (turnRemaining < 0.22) {
          const outFrac = easeInOutQuad(clamp((0.22 - turnRemaining) / 0.22, 0, 1));
          peterX = -1200 * outFrac;
        }
        const bobY = Math.sin(clampedT * Math.PI * 4) * 6;
        const breathScale = 1.0 + 0.012 * Math.sin(clampedT * Math.PI * 2);
        peterEl.style.transform = `translateX(${peterX}px) translateY(${bobY}px) scale(${breathScale})`;
        stewieEl.style.transform = `translateX(1200px)`;
      } else if (isStewie) {
        const turnElapsed = clampedT - activeTurn.start;
        const turnRemaining = activeTurn.end - clampedT;
        let stewieX = 0;
        if (turnElapsed < 0.22) {
          const inFrac = easeOutCubic(clamp(turnElapsed / 0.22, 0, 1));
          stewieX = 1200 * (1 - inFrac);
        } else if (turnRemaining < 0.22) {
          const outFrac = easeInOutQuad(clamp((0.22 - turnRemaining) / 0.22, 0, 1));
          stewieX = 1200 * outFrac;
        }
        const bobY = Math.sin(clampedT * Math.PI * 4) * 6;
        const breathScale = 1.0 + 0.012 * Math.sin(clampedT * Math.PI * 2);
        stewieEl.style.transform = `translateX(${stewieX}px) translateY(${bobY}px) scale(${breathScale})`;
        peterEl.style.transform = `translateX(-1200px)`;
      } else {
        peterEl.style.transform = `translateX(-1200px)`;
        stewieEl.style.transform = `translateX(1200px)`;
      }
    };

    // Initial render
    window.renderAt(0);
  </script>
</body>
</html>
